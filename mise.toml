[tools]
bun = "1.3.14"

[tasks.dev]
run = "bun run dev"
description = "Start development server"

[tasks.lint]
run = "bun run lint"
description = "Lint code"

[tasks.format]
run = "bun run format"
description = "Format code"

[tasks."check:code"]
run = "bun run check:code"
description = "Check code"

[tasks.build]
run = "bun run build"
description = "Build project"

[tasks.check]
depends = ["build"]
run = "bunx wrangler deploy --dry-run"
description = "Check deployment"

[tasks.preview]
depends = ["build"]
run = "bunx vite preview"
description = "Preview build"

[tasks.test]
run = "bun run test"
description = "Run unit tests"

[tasks."test:run"]
run = "bun run test --run"
description = "Run unit tests single run"

[tasks.coverage]
run = "bun run coverage"
description = "Run coverage"

[tasks."test:ui"]
run = "bun run test:ui"
description = "Run tests with UI"

[tasks."test:e2e"]
run = "bun run test:e2e"
description = "Run Playwright E2E tests"

[tasks."test:e2e:ci"]
depends = ["seed:e2e:preview"]
run = [
    "bunx playwright install chromium firefox",
    "bunx playwright test",
]
description = "Seed preview D1, install browsers, run E2E against BASE_URL (for CI)"

[tasks."cf-typegen"]
run = "bun run cf-typegen"
description = "Generate Cloudflare types"

[tasks."seed:local"]
run = "bun run seed:local"
description = "Seed local database"

[tasks."seed:preview"]
run = "bun run seed:preview"
description = "Seed preview database"

[tasks."seed:prod"]
run = "bun run seed:prod"
description = "Seed production database"

[tasks."seed:e2e:local"]
run = "bun run seed:e2e:local"
description = "Seed E2E test data in local D1"

[tasks."seed:e2e:preview"]
run = "bun run seed:e2e:preview"
description = "Seed E2E test data in preview D1"

[tasks."migrate:generate"]
run = "bun run migrate:generate"
description = "Generate migrations"

[tasks."migrate:local"]
run = "bun run migrate:local"
description = "Run migrations locally"

[tasks."migrate:preview"]
run = "bun run migrate:preview"
description = "Run migrations in preview"

[tasks."migrate:prod"]
run = "bun run migrate:prod"
description = "Run migrations in production"

[tasks.deploy]
depends = ["build"]
run = "bun run deploy"
description = "Deploy to production"

[tasks."deploy:preview"]
depends = [{ task = "build", env = { CLOUDFLARE_ENV = "preview" } }]
run = "bun run deploy:preview"
description = "Build with CLOUDFLARE_ENV=preview and deploy to preview"
