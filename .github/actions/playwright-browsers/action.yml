name: Playwright Browsers
description: "Restore cached Playwright browsers (downloading them on a miss) and optionally install their system libraries"
inputs:
  install-deps:
    description: "Also install the browsers' system libraries. Running tests needs them; filling the cache doesn't."
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      # Browser builds are pinned by playwright-core, so the cache follows its
      # locked version: lockfile churn that doesn't move it keeps the cache.
      # Fails loudly if the lockfile format changes and the match comes back empty.
      run: |
        version=$(grep -oP '"playwright-core": \["playwright-core@\K[^"]+' bun.lock | head -n1)
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.version.outputs.version }}

    # apt packages can't be cached across runs, so this runs every time (~15s).
    # A slow Azure apt mirror once stretched it to 17 minutes (#348), so each
    # attempt gets 4 minutes, and the retry goes to Canonical's mirror instead.
    # Composite steps can't take timeout-minutes, hence the shell `timeout`.
    - name: Install Playwright system dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: |
        install_deps() {
          # Run as root so `timeout` kills apt-get itself, not only the bunx
          # wrapper: a surviving apt-get would hold the dpkg lock against the
          # retry. As root, Playwright calls apt directly instead of via sudo.
          sudo env "PATH=$PATH" timeout 4m \
            bunx playwright install-deps chromium firefox
        }
        if install_deps; then exit 0; fi
        echo "::warning::install-deps failed or hit 4m; retrying on archive.ubuntu.com"
        # Finish any install the timeout cut off mid-unpack.
        sudo dpkg --configure -a
        # Runner images list mirrors in apt-mirrors.txt or the sources files;
        # rewrite whichever exist.
        sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' \
          /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
          /etc/apt/sources.list.d/* 2>/dev/null || true
        install_deps

    - name: Install Playwright browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: bunx playwright install chromium firefox
