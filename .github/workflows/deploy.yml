name: Deploy
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 15
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        with:
          token: ${{ github.token }}
          environment: Preview (${{ github.head_ref }})
          initial-status: pending

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run build
        run: mise run build
        env:
          CLOUDFLARE_ENV: ${{ github.event_name == 'pull_request' && 'preview' || '' }}

      - name: Apply D1 Migrations
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            ${{ github.ref == 'refs/heads/main'
              && 'd1 migrations apply terminal-quest --remote'
              || 'd1 migrations apply terminal-quest-preview --remote --env preview'
            }}

      - name: Deploy to Cloudflare
        id: deploy
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            ${{ github.ref == 'refs/heads/main'
              && 'deploy'
              || format('deploy --env preview --name quiz-app-preview-pr-{0} --var AUTH_TEST_BYPASS_SECRET:{1}', github.event.pull_request.number, secrets.AUTH_TEST_BYPASS_SECRET)
            }}

      - name: Update Deployment
        uses: chrnorm/deployment-status@v2
        # Non-blocking: a status-report failure must not fail the deploy job, which
        # would suppress the e2e job (needs.deploy.result == 'success'). Failure is
        # still visible as a warning step in the run log.
        continue-on-error: true
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && steps.deployment.outcome == 'success'
        with:
          token: ${{ github.token }}
          environment-url: ${{ steps.deploy.outputs.deployment-url }}
          state: ${{ steps.deploy.outcome == 'success' && 'success' || 'error' }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

  e2e:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && needs.deploy.result == 'success'
    # A plain runner, not the mcr.microsoft.com/playwright container: measured in
    # #279, pulling and starting the image cost more than the cached browsers and
    # apt install it was meant to save.
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Setup Playwright Browsers
        uses: ./.github/actions/playwright-browsers

      - name: Run E2E Tests
        run: mise run test:e2e:ci
        env:
          BASE_URL: ${{ needs.deploy.outputs.deployment-url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_TEST_BYPASS_SECRET: ${{ secrets.AUTH_TEST_BYPASS_SECRET }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.event.number }}
          path: e2e/playwright-report/

  playwright-cache:
    # GitHub scopes a PR's caches to that PR, and e2e only runs on PRs, so each
    # PR's first e2e run would download the browsers. A cache saved on main is
    # readable from every PR. Not a required check.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Setup Playwright Browsers
        uses: ./.github/actions/playwright-browsers
        with:
          install-deps: "false"
