name: Deploy
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        with:
          token: ${{ github.token }}
          environment: Preview (${{ github.head_ref }})
          initial-status: pending

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run build
        run: mise run build
        env:
          CLOUDFLARE_ENV: ${{ github.event_name == 'pull_request' && 'preview' || '' }}

      - name: Apply D1 Migrations
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            ${{ github.ref == 'refs/heads/main'
              && 'd1 migrations apply terminal-quest --remote'
              || 'd1 migrations apply terminal-quest-preview --remote --env preview'
            }}

      - name: Deploy to Cloudflare
        id: deploy
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            ${{ github.ref == 'refs/heads/main'
              && 'deploy'
              || format('deploy --env preview --name quiz-app-preview-pr-{0}', github.event.pull_request.number)
            }}

      - name: Run E2E Tests
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && steps.deploy.outcome == 'success'
        run: mise run test:e2e
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && steps.deploy.outcome == 'success'
        with:
          name: playwright-report-${{ github.event.number }}
          path: e2e/playwright-report/

      - name: Update Deployment (Success)
        uses: chrnorm/deployment-status@v2
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && steps.deployment.conclusion != 'skipped' && steps.deploy.outcome == 'success'
        with:
          token: ${{ github.token }}
          environment-url: ${{ steps.deploy.outputs.deployment-url }}
          state: 'success'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Update Deployment (Failure)
        uses: chrnorm/deployment-status@v2
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && steps.deployment.conclusion != 'skipped' && steps.deploy.outcome != 'success'
        with:
          token: ${{ github.token }}
          state: 'error'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
