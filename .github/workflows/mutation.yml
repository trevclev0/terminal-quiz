name: Mutation Testing
on:
  schedule:
    # Twice a week: GitHub evicts caches unused for 7 days, so a weekly run
    # right at that edge could lose the incremental results.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # Incremental cache: Stryker reuses results for mutants whose code and
      # covering tests are unchanged. Restore and save are separate steps so
      # the save runs even when the score gate fails the job (the combined
      # actions/cache only saves after a successful job). Each run has its own
      # key prefix so one run's cache never shadows the other's.
      # Incremental reuse only checks the mutated file and its covering tests,
      # not config: a change to stryker.*.json or vite.config.ts that alters
      # results leaves stale verdicts in the cache. Bump the -vN suffix (in the
      # restore and save steps) after such a change to force one cold run.
      # v2: the pre-#348 cache carried 30 stale validation.ts survivors.
      - name: Restore Stryker hooks incremental cache
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-hooks-v2-${{ github.sha }}
          restore-keys: |
            stryker-hooks-v2-

      - name: Restore Stryker resolvers incremental cache
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-resolvers-incremental.json
          key: stryker-resolvers-${{ github.sha }}
          restore-keys: |
            stryker-resolvers-

      # Every step after the first run is `if: ${{ !cancelled() }}`: a red score gate in
      # one run must not skip the other run, its report, or either cache save,
      # while a cancelled run (cancel-in-progress) still stops cleanly.
      - name: Run mutation tests (pure logic and hooks)
        run: mise run mutate

      - name: Run mutation tests (gameplay resolvers)
        if: ${{ !cancelled() }}
        run: mise run mutate:resolvers

      - name: Upload hooks mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

      - name: Upload resolvers mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-resolvers
          path: reports/mutation-resolvers/
          if-no-files-found: ignore

      - name: Save Stryker hooks incremental cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-hooks-v2-${{ github.sha }}

      - name: Save Stryker resolvers incremental cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-resolvers-incremental.json
          key: stryker-resolvers-${{ github.sha }}
