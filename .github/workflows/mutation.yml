name: Mutation Testing
on:
  schedule:
    # Twice a week: GitHub evicts caches unused for 7 days, so a weekly run
    # right at that edge could lose the incremental results.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # Incremental cache: Stryker reuses results for mutants whose code and
      # covering tests are unchanged. Restore and save are separate steps so
      # the save runs even when the score gate fails the job (the combined
      # actions/cache only saves after a successful job).
      - name: Restore Stryker incremental cache
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.sha }}
          restore-keys: |
            stryker-

      - name: Run mutation tests
        run: mise run mutate

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

      - name: Save Stryker incremental cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.sha }}
