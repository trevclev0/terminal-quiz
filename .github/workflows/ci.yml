name: CI
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Check generated GraphQL artifacts are up to date
        run: |
          mise run schema:generate
          mise run gql:generate
          if ! git diff --exit-code --quiet -- graphql/schema.graphql src/shared/generated/graphql.ts; then
            echo "::error::Generated GraphQL artifacts are out of date. Run 'bun run schema:generate && bun run gql:generate' and commit the output."
            git diff --stat -- graphql/schema.graphql src/shared/generated/graphql.ts
            exit 1
          fi

      - name: Run Biome checks
        run: mise run check:code

      - name: Run tests with coverage
        id: tests
        run: mise run coverage

      - name: Report coverage
        # The report action reads coverage/coverage-summary.json, which the
        # coverage run only writes on success. Without this gate a test
        # failure cascades into a spurious ENOENT error.
        if: steps.tests.outcome == 'success'
        uses: davelosert/vitest-coverage-report-action@v2

  integration-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run integration tests
        run: mise run test:integration

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Validate commit messages
        run: bunx commitlint --from origin/${{ github.base_ref }} --to HEAD
