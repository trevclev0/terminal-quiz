<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Terminal Quiz</title>
    <link rel="icon" type="image/svg+xml" href="/terminal-quiz.svg" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/react-app/main.tsx"></script>
    <style>
      @keyframes terminal-quiz-boot-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      #boot-fallback .cursor {
        display: inline-block;
        width: 0.6em;
        height: 1em;
        background: #4caf50;
        animation: terminal-quiz-boot-blink 1s step-start infinite;
        position: relative;
        top: .3rem;
      }
      #boot-fallback {
        font-family: "Glass TTY VT220", "Courier New", Courier, monospace;
        color: #4caf50;
        font-size: 20pt;
      }
      #boot-fallback .inverse {
        background: #4caf50;
        color: #0a0f0a;
        padding: 0 4px;
      }
      #boot-fallback .reload {
        color: #4caf50;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-fallback .cursor {
          animation: none;
        }
      }
      .dn {
        display: none;
      }
    </style>
    <script>
      window.addEventListener(
        'DOMContentLoaded',
        () => {
          const bootFallback = document.getElementById("boot-fallback");
          if (bootFallback) {
            window.setTimeout(() => bootFallback.style.removeProperty("display"), 0);
          }
        }
      )
      window.addEventListener(
        "error",
        () => {
          if (!document.getElementById("boot-fallback")) return;
          const root = document.getElementById("app-root");
          if (root) {
            root.innerHTML =
              '<div id="boot-fallback"><div><span class="inverse">LOAD FAILURE</span></div><div>Failed to initialize terminal. Check connection.</div><div><a class="reload" href="/">[ RELOAD ]</a></div></div>';
          }
          try {
            let sessionId = localStorage.getItem("terminal_quiz_session_id");
            if (!sessionId && crypto.randomUUID) {
              sessionId = crypto.randomUUID();
              localStorage.setItem("terminal_quiz_session_id", sessionId);
            }
            const payload = JSON.stringify({
              sessionId: sessionId || "",
              source: "boot",
              message: "bootstrap load failure",
              path: window.location.pathname,
            });
            navigator.sendBeacon("/api/error", payload);
          } catch {
            // Telemetry must never break the boot failure UI.
          }
        },
        true,
      );
    </script>

  </head>

  <body style="background-color: #0a0f0a;">
    <div id="app-root">
      <div id="boot-fallback" style="display: none;">
        <div><span class="inverse">TERMINAL QUIZ</span><span class="cursor"></span></div>
        <div>LOADING…</div>
      </div>
    </div>
  </body>
</html>
