}

type Me {
  id: String!
  email: String!
  name: String!
  image: String
}

type ProgramListItem {
  id: String!
  name: String!
  visibility: String!
  authorId: String
}

type GateManagement {
  id: String!
  programId: String!
  sequenceOrder: Int!
  label: String!
  question: String!
  correctAnswer: String!
  successMessage: String!
  acceptanceThreshold: Float!
  guidanceEnabled: Boolean!
  guidanceThreshold: Int!
}

type ProgressionPayload {
  currentGate: ActiveGate
  completedGates: [CompletedGate!]!
  status: String!
}

type ActiveGate {
  id: String!
  label: String!
  question: String!
}

type CompletedGate {
  id: String!
  label: String!
  question: String!
  correctAnswer: String!
  successMessage: String!
}

type Mutation {
  submitGuess(programId: String!, gateId: String!, guess: String!): SubmitGuessPayload
  requestClue(programId: String!, gateId: String!, currentGuess: String!): RequestClueResult
  resetSession(programId: String!): Boolean!
  createProgram(name: String!, visibility: String): ProgramManagement
  updateProgram(id: String!, name: String, visibility: String): ProgramManagement
  deleteProgram(id: String!): Boolean!
  createGate(programId: String!, label: String!, question: String!, correctAnswer: String!, successMessage: String!, sequenceOrder: Int!, acceptanceThreshold: Float, guidanceEnabled: Boolean, guidanceThreshold: Int): GateManagement
  updateGate(id: String!, label: String, question: String, correctAnswer: String, successMessage: String, sequenceOrder: Int, acceptanceThreshold: Float, guidanceEnabled: Boolean, guidanceThreshold: Int): GateManagement
  deleteGate(id: String!): Boolean!
  reorderGates(programId: String!, orderedGateIds: [String!]!): Boolean!
}

type SubmitGuessPayload {
  success: Boolean!
  message: String
  nextGate: ActiveGate
  canRequestClue: Boolean!
}

type RequestClueResult {
  clueText: String
  isClueLimitReached: Boolean!
  cluesRemaining: Int!
  isRateLimited: Boolean!
  retryAfterMs: Int
  isAiBudgetExhausted: Boolean!
}

type ProgramManagement {
  id: String!
  name: String!
  visibility: String!
  authorId: String
  createdAt: String!
}
