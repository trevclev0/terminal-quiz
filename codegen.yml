overwrite: true
schema: ./graphql/schema.graphql
documents:
  - ./src/shared/gqlQueries.ts
generates:
  ./src/shared/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
    config:
      useTypeImports: true
      skipTypename: true
      avoidOptionals:
        field: true
